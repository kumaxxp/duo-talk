# LLMバックエンド設定
# Ollama / vLLM (Docker) を切り替えて運用

backends:
  ollama:
    enabled: true
    base_url: "http://localhost:11434/v1"
    api_type: "openai_compatible"
    health_check_url: "http://localhost:11434/api/tags"
    models:
      gemma3-12b:
        name: "gemma3:12b"
        supports_vlm: true
        vram_estimate_gb: 8
        context_length: 8192
        quantization: "Q4_K_M"
        description: "Ollama版 Gemma3 12B"
      gemma3-27b:
        name: "gemma3:27b"
        supports_vlm: true
        vram_estimate_gb: 17
        context_length: 8192
        quantization: "Q4_K_M"
        description: "Ollama版 Gemma3 27B（大型）"
      # Gemma3 Abliterated (検閲除去版) - LLMのみ
      gemma3-abliterated-4b:
        name: "huihui_ai/gemma3-abliterated:4b"
        supports_vlm: false
        vram_estimate_gb: 3
        context_length: 8192
        quantization: "Q4_K_M"
        description: "Gemma3 4B Abliterated（検閲除去・軽量）"
      gemma3-abliterated-12b:
        name: "huihui_ai/gemma3-abliterated:12b"
        supports_vlm: false
        vram_estimate_gb: 8
        context_length: 8192
        quantization: "Q4_K_M"
        description: "Gemma3 12B Abliterated（検閲除去・推奨）"
      gemma3-abliterated-27b:
        name: "huihui_ai/gemma3-abliterated:27b"
        supports_vlm: false
        vram_estimate_gb: 17
        context_length: 8192
        quantization: "Q4_K_M"
        description: "Gemma3 27B Abliterated（検閲除去・高性能）"

  vllm:
    enabled: true
    base_url: "http://localhost:8000/v1"
    api_type: "openai_compatible"
    health_check_url: "http://localhost:8000/v1/models"
    docker:
      image: "vllm/vllm-openai:latest"
      gpu_memory_utilization: 0.85
      ipc_host: true
      cache_mount: "~/.cache/huggingface:/root/.cache/huggingface"
    models:
      gemma3-27b-int4:
        name: "RedHatAI/gemma-3-27b-it-quantized.w4a16"
        supports_vlm: true
        quantization: "w4a16"
        vram_estimate_gb: 22
        context_length: 4096
        description: "推奨構成（27B INT4量子化）"
        docker_args:
          - "--trust-remote-code"
          - "--max-model-len"
          - "4096"
          - "--dtype"
          - "bfloat16"
          - "--enforce-eager"
      gemma3-12b-int8:
        name: "RedHatAI/gemma-3-12b-it-quantized.w8a8"
        supports_vlm: true
        quantization: "w8a8"
        vram_estimate_gb: 14
        context_length: 8192
        description: "軽量構成（INT8量子化）"
        docker_args:
          - "--trust-remote-code"
          - "--max-model-len"
          - "8192"
      gemma3-12b-gptq:
        name: "ISTA-DASLab/gemma-3-12b-it-GPTQ-4b-128g"
        supports_vlm: true
        quantization: "gptq"
        vram_estimate_gb: 7
        context_length: 8192
        description: "最軽量（GPTQ 4bit）"
        docker_args:
          - "--trust-remote-code"
          - "--max-model-len"
          - "8192"
      qwen25-14b-awq:
        name: "Qwen/Qwen2.5-14B-Instruct-AWQ"
        supports_vlm: false
        quantization: "awq"
        vram_estimate_gb: 10
        context_length: 8192
        description: "テキスト専用（高品質）"
        docker_args:
          - "--quantization"
          - "awq"

      # ============================
      # Abliterated Models（検閲除去版）
      # ============================
      # 姉妹間の自然な会話（軽い口喧嘩、功績の主張など）を実現するための
      # abliterated/hereticモデル。AI安全制約が緩和されている。
      # 注意: リスク対策としてsystem_general.txtとdeep_values.yamlで
      #       姉妹キャラの範囲内に行動を制限している。

      gemma3-12b-abliterated:
        name: "mlabonne/gemma-3-12b-it-abliterated"
        supports_vlm: true
        quantization: "none"
        vram_estimate_gb: 24
        context_length: 8192
        description: "Gemma3 12B Abliterated - mlabonne版（検閲除去）"
        docker_args:
          - "--trust-remote-code"
          - "--max-model-len"
          - "8192"
          - "--dtype"
          - "bfloat16"

      gemma3-12b-abliterated-v2:
        name: "mlabonne/gemma-3-12b-it-abliterated-v2"
        supports_vlm: true
        quantization: "none"
        vram_estimate_gb: 24
        context_length: 8192
        description: "Gemma3 12B Abliterated v2 - 改良版（Minos評価使用）"
        docker_args:
          - "--trust-remote-code"
          - "--max-model-len"
          - "8192"
          - "--dtype"
          - "bfloat16"

      gemma3-12b-heretic:
        name: "DreamFast/gemma-3-12b-it-heretic"
        supports_vlm: false
        quantization: "none"
        vram_estimate_gb: 24
        context_length: 8192
        description: "Gemma3 12B Heretic - KL divergence最小化版（推奨）"
        docker_args:
          - "--trust-remote-code"
          - "--max-model-len"
          - "8192"
          - "--dtype"
          - "bfloat16"

      gemma3-4b-abliterated:
        name: "mlabonne/gemma-3-4b-it-abliterated"
        supports_vlm: true
        quantization: "none"
        vram_estimate_gb: 8
        context_length: 8192
        description: "Gemma3 4B Abliterated - 軽量版（VRAM節約）"
        docker_args:
          - "--trust-remote-code"
          - "--max-model-len"
          - "8192"
          - "--dtype"
          - "bfloat16"

# デフォルト設定
defaults:
  backend: "vllm"
  model: "gemma3-12b-int8"
  fallback_backend: "ollama"
  fallback_model: "gemma3-12b"

# Florence-2設定（将来拡張用）
florence2:
  enabled: false
  model: "microsoft/Florence-2-large"
  vram_estimate_gb: 2.5
